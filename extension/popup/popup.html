<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RE-session popup</title>
    <style>
      :root {
        --bg: #EEF0EE;
        --ink: #1C1E1C;
        --surface: #FFFFFF;
        --border: #D8DBD8;
        --accent-safe: #2F6F5E;
        --accent-warning: #B5651D;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        min-height: 390px;
        background: linear-gradient(145deg, #EEF0EE 0%, #E5EBE7 100%);
        color: var(--ink);
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      .wrap {
        padding: 16px;
      }
      h1 { font-size: 1.3rem; margin: 0 0 16px; }
      .field { display: grid; gap: 6px; margin-bottom: 12px; }
      label { font-size: 0.8rem; color: rgba(28, 30, 28, 0.75); }
      input, select, button {
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font: inherit;
      }
      button {
        cursor: pointer;
        background: var(--surface);
        color: var(--ink);
      }
      .primary {
        background: var(--accent-safe);
        color: white;
        border-color: var(--accent-safe);
      }
      .secondary {
        background: var(--surface);
      }
      .status, .active-session {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        padding: 10px 12px;
        margin-top: 12px;
      }
      .active-session {
        border-color: rgba(47, 111, 94, 0.45);
        box-shadow: 0 8px 20px rgba(47, 111, 94, 0.1);
      }
      .active-session-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .active-session-title { margin: 0; font-size: 1rem; }
      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent-safe);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .live-badge::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-safe);
        box-shadow: 0 0 0 4px rgba(47, 111, 94, 0.12);
      }
      .active-task { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; }
      .active-meta { margin: 0; font-size: 0.8rem; opacity: 0.72; }
      .active-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
      .metric { padding: 9px; border-radius: 7px; background: #F3F6F3; }
      .metric-label { display: block; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.62; }
      .metric-value { display: block; margin-top: 4px; font-size: 0.82rem; font-weight: 600; }
      .active-session .danger-button { width: 100%; margin-top: 14px; }
      .danger-button { color: #8A3D1B; border-color: #D9B09B; background: #FFF9F6; }
      .status .label {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .danger { color: var(--accent-warning); }
      .ok { color: var(--accent-safe); }
      .row { display: flex; gap: 8px; align-items: center; }
      .row button { flex: 1; }
      .mini { font-size: 0.78rem; opacity: 0.8; }
      .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .view-header h1 { margin: 0; }
      .link-button {
        min-height: auto;
        border: 0;
        padding: 4px;
        background: transparent;
        color: var(--accent-safe);
        font-size: 0.8rem;
      }
      .settings-note { margin: -4px 0 16px; }
      .settings-status { min-height: 1.2em; margin-top: 10px; }
      .auth-note { margin: -4px 0 16px; }
      .auth-view { display: grid; gap: 12px; }
      .auth-view h1 { margin-bottom: 0; }
      .folder-controls { display: none; gap: 8px; margin: -4px 0 12px; }
      .folder-status { min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section id="authView" class="auth-view">
        <h1>Sign in to RE-session</h1>
        <p class="mini auth-note">Use the same account as the recovery website. This extension signs in separately.</p>
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="Your password" />
        </div>
        <button id="signIn" class="primary" type="button">Sign in</button>
        <button id="openSettingsFromAuth" class="link-button" type="button">Supabase settings</button>
        <div class="status" id="authErrorPanel" style="display:none">
          <div id="authErrorText" class="mini danger"></div>
        </div>
      </section>
      <section id="mainView" style="display:none">
        <div class="view-header">
          <h1>RE-session</h1>
          <div class="row">
            <button id="signOut" class="link-button" type="button">Sign out</button>
            <button id="openSettings" class="link-button" type="button">Settings</button>
          </div>
        </div>
        <div id="setupControls">
          <div class="field">
            <label for="taskName">Task name</label>
            <input id="taskName" type="text" placeholder="e.g. Final prototype draft" />
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="code">Code</option>
              <option value="email">Email</option>
              <option value="form">Form</option>
              <option value="doc_notion">Doc/Notion</option>
              <option value="terminal">Terminal</option>
              <option value="autosave">Autosave</option>
            </select>
          </div>

          <div id="folderControls" class="folder-controls">
            <button id="chooseFolder" class="secondary" type="button">Choose Folder</button>
            <div id="folderStatus" class="mini folder-status" role="status"></div>
          </div>

          <div class="row">
            <button id="toggleSession" class="primary" disabled>Start session</button>
          </div>
        </div>

        <section id="activeSession" class="active-session" style="display:none" aria-live="polite">
          <div class="active-session-header">
            <h2 class="active-session-title">Session active</h2>
            <span class="live-badge">Live</span>
          </div>
          <p id="activeTask" class="active-task"></p>
          <p id="activeMeta" class="active-meta"></p>
          <div class="active-metrics">
            <div class="metric">
              <span class="metric-label">Last checkpoint</span>
              <strong id="activeCheckpoint" class="metric-value">Waiting...</strong>
            </div>
            <div class="metric">
              <span class="metric-label">Capture</span>
              <strong id="activeCapture" class="metric-value">Starting...</strong>
            </div>
          </div>
          <button id="endActiveSession" class="secondary danger-button" type="button">End session</button>
        </section>

        <div class="status">
          <span class="label">Status</span>
          <div id="sessionState" class="mini">Signed out</div>
        </div>

        <div class="status">
          <span class="label">Last checkpoint</span>
          <div id="lastCheckpoint" class="mini">No checkpoint yet</div>
        </div>

        <div class="status">
          <span class="label">Capture readiness</span>
          <div id="captureInfo" class="mini">No active capture</div>
        </div>

        <div class="status" id="errorPanel" style="display:none">
          <span class="label">Error</span>
          <div id="errorText" class="mini danger"></div>
        </div>
      </section>
    </div>

    <script src="../lib/supabase-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
